<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مولد كلمات مرور قوية وآمنة - أنشئ كلمات مرور عشوائية بسهولة">
    <title>مولد كلمات المرور - Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 مولد كلمات المرور</h1>
            <p class="subtitle">أنشئ كلمات مرور قوية وآمنة بنقرة واحدة</p>
        </div>

        <div class="password-card">
            <div class="password-display-wrapper">
                <input type="text" id="password-display" class="password-display" readonly value="">
                <button id="copy-btn" class="icon-btn copy-btn" title="نسخ" aria-label="Copy password">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
            </div>
            
            <div class="strength-indicator">
                <div class="strength-bar">
                    <div id="strength-fill" class="strength-fill"></div>
                </div>
                <span id="strength-text" class="strength-text">متوسطة</span>
            </div>
        </div>

        <div class="controls-card">
            <div class="control-group">
                <div class="control-header">
                    <label for="length-slider">طول كلمة المرور</label>
                    <span id="length-value" class="value-display">16</span>
                </div>
                <input type="range" id="length-slider" class="slider" min="8" max="32" value="16">
            </div>

            <div class="options-grid">
                <div class="checkbox-group">
                    <input type="checkbox" id="uppercase" checked>
                    <label for="uppercase">
                        <span class="checkbox-custom"></span>
                        <span class="label-text">حروف كبيرة (A-Z)</span>
                    </label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="lowercase" checked>
                    <label for="lowercase">
                        <span class="checkbox-custom"></span>
                        <span class="label-text">حروف صغيرة (a-z)</span>
                    </label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="numbers" checked>
                    <label for="numbers">
                        <span class="checkbox-custom"></span>
                        <span class="label-text">أرقام (0-9)</span>
                    </label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="symbols" checked>
                    <label for="symbols">
                        <span class="checkbox-custom"></span>
                        <span class="label-text">رموز (!@#$%^&*)</span>
                    </label>
                </div>
            </div>

            <button id="generate-btn" class="generate-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                </svg>
                توليد كلمة مرور جديدة
            </button>
        </div>

        <div class="footer">
            <p>💡 نصيحة: استخدم كلمات مرور فريدة لكل حساب</p>
        </div>
    </div>

    <div id="copy-notification" class="copy-notification">
        ✓ تم النسخ إلى الحافظة!
    </div>

    <script src="script.js"></script>
</body>
</html>
